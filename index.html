<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>批量图片裁切工具</title>
<style>
:root{--blue:#398fd0;--deep:#2477c8;--yellow:#f7b522;--bg:#f4f5f7;--ink:#30343b}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:var(--ink);background:#eceeef}.app{max-width:1450px;margin:18px auto;background:#fff;min-height:calc(100vh - 36px);display:grid;grid-template-columns:minmax(0,1fr) 360px;box-shadow:0 1px 8px #00000012}.workspace{padding:34px;display:flex;flex-direction:column;min-height:760px}.drop{flex:1;border:2px dashed #d6dbe2;border-radius:14px;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;transition:.2s;background:linear-gradient(135deg,#fff,#fafbfd)}.drop.over{border-color:var(--blue);background:#f2f8ff}.drop h2{font-size:22px;font-weight:500;margin:16px 0 8px}.drop p{color:#8b929b;margin:5px}.upload{background:#1677e8;color:#fff;border:0;padding:13px 45px;border-radius:9px;font-size:16px;cursor:pointer;margin-top:18px}.icon{font-size:62px;color:#3e4247}.hint{color:#888;margin-top:18px}.preview{display:none;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:15px;margin-top:18px;max-height:240px;overflow:auto}.thumb{position:relative;border:1px solid #e1e5ea;border-radius:8px;overflow:hidden;background:#fafafa}.thumb img{width:100%;height:130px;object-fit:contain;display:block}.thumb span{display:block;font-size:12px;padding:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.thumb button{position:absolute;right:4px;top:4px;border:0;border-radius:50%;background:#fff;color:#e34b4b;cursor:pointer}.panel{background:#f6f7f8;padding:26px 22px;overflow:auto}.section{border-bottom:1px solid #e0e3e7;padding-bottom:22px;margin-bottom:20px}.section h3,.action{background:var(--yellow);color:#fff;text-align:center;border-radius:10px;padding:16px;font-size:18px;margin:0 0 18px;font-weight:600}.section h3.blue,.action{background:var(--blue)}label{display:flex;align-items:center;gap:10px;margin:12px 0;font-size:16px}input[type=number],input[type=text],select{border:1px solid #d2d7de;border-radius:8px;padding:9px 10px;font-size:16px;width:100px;background:#fff}input[type=checkbox],input[type=radio]{accent-color:#167df0;width:18px;height:18px}.row{display:flex;align-items:center;gap:8px;margin:10px 0}.row input{flex:1}.ratio{display:grid;grid-template-columns:1fr 22px 1fr;align-items:center;gap:8px}.ratio input{width:100%}.radio-row{display:grid;grid-template-columns:1fr 100px;align-items:center;margin:12px 0}.radio-row label{margin:0}.radio-row input[type=number]{width:100%}.action{width:100%;border:0;cursor:pointer;font-size:17px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.subtle{color:#8a9098;font-size:13px;text-align:center;cursor:pointer}.status{font-size:13px;color:#6e757d;margin:0 0 12px}.empty{color:#9ca3ad;font-size:14px}
 .cropbox{display:none;margin-top:18px;padding:16px;border:1px solid #e1e5ea;border-radius:12px;background:#fafafa}.cropbox canvas{display:block;max-width:100%;max-height:360px;margin:auto;background:#222}.crop-controls{display:flex;gap:12px;align-items:center;margin-top:12px;font-size:13px}.crop-controls input{flex:1}@media(max-width:900px){.app{display:block;margin:0;min-height:100vh}.workspace{min-height:480px;padding:18px}.panel{padding:20px}.preview{max-height:none}}
</style></head>
<body><main class="app"><section class="workspace"><div class="drop" id="drop"><div><div class="icon">▧</div><h2>拖拽图片到这里</h2><p>- 或 -</p><button class="upload" id="choose">从本地选择图片</button><p class="hint">支持 JPG、PNG、WEBP · 可批量处理</p><input id="files" type="file" accept="image/*" multiple hidden></div></div><div class="cropbox" id="cropbox"><canvas id="cropcanvas"></canvas><div class="crop-controls"><span>拖动裁切区域：</span><input id="cropx" type="range" min="0" max="100" value="50"><span id="cropvalue">居中</span></div></div><div class="preview" id="preview"></div></section>
<aside class="panel"><div class="section"><h3>调整大小 / 裁剪</h3><div class="row"><span>宽</span><input id="w" type="number" value="720" min="1"><span>px</span><label><input id="autoW" type="checkbox">自动</label></div><div class="row"><span>高</span><input id="h" type="number" value="1280" min="1"><span>px</span><label><input id="autoH" type="checkbox">自动</label></div><div class="row"><span>比例</span><div class="ratio"><input id="rw" type="number" value="9" min="1"><b>:</b><input id="rh" type="number" value="16" min="1"></div></div><label><input id="focus" type="checkbox" checked>自动检测图像焦点（居中裁剪）</label><label><input id="noResize" type="checkbox">不进行大小调整</label></div>
<details class="section collapsible"><summary>图片格式 &amp; 质量</summary><div class="row"><span>质量预设:</span><select id="preset"><option value="0.92">High</option><option value="0.8" selected>Medium</option><option value="0.65">Low</option></select></div><p>保存格式:</p><div class="radio-row"><label><input type="radio" name="format" value="same" checked> 与原图片相同</label></div><div class="radio-row"><label><input type="radio" name="format" value="jpeg"> JPEG</label><input id="jq" type="number" value="92" min="1" max="100">%</div><div class="radio-row"><label><input type="radio" name="format" value="webp"> WEBP</label><input id="wq" type="number" value="80" min="1" max="100">%</div></details>
<details class="section collapsible"><summary>重命名</summary><label><input id="renameEnabled" type="checkbox">启用批量重命名</label><div class="row"><span>前缀</span><input id="prefix" type="text" value="裁切图片_"></div><div class="row"><span>起始编号</span><input id="start" type="number" value="1" min="0"></div></details>
<p class="status" id="status">尚未选择图片</p><div class="actions"><button class="action" id="zip">保存为 ZIP 压缩包</button><button class="action" id="save">保存文件（批量自动打包）</button></div><p class="subtle" id="clear">移除全部　　恢复默认设置</p></aside></main>
<script src="vendor/smartcrop.js"></script><script src="vendor/jszip.min.js"></script><script>
const $=id=>document.getElementById(id), files=$('files'), drop=$('drop'), preview=$('preview');let items=[];
function addFiles(list){[...list].filter(f=>f.type.startsWith('image/')).forEach(file=>{const url=URL.createObjectURL(file);items.push({file,url,crop:50});});render();showCrop();}
function showCrop(){if(!items.length){$('cropbox').style.display='none';return}$('cropbox').style.display='block';const img=new Image();img.onload=()=>{const c=$('cropcanvas'),scale=Math.min(1,560/img.width);c.width=img.width*scale;c.height=img.height*scale;const ctx=c.getContext('2d');ctx.drawImage(img,0,0,c.width,c.height);const ratio=+$('w').value/+$('h').value;let cw=c.width,ch=c.height;if(cw/ch>ratio)cw=ch*ratio;else ch=cw/ratio;const x=(c.width-cw)*items[0].crop/100,y=(c.height-ch)/2;ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(0,0,c.width,c.height);ctx.clearRect(x,y,cw,ch);ctx.strokeStyle='#f7b522';ctx.lineWidth=3;ctx.strokeRect(x,y,cw,ch);$('cropvalue').textContent=Math.round(items[0].crop)+'%'};img.src=items[0].url}
function render(){preview.innerHTML='';preview.style.display=items.length?'grid':'none';items.forEach((it,i)=>{const d=document.createElement('div');d.className='thumb';d.innerHTML=`<button data-i="${i}">×</button><img src="${it.url}"><span>${it.file.name}</span>`;preview.appendChild(d)});$('status').textContent=items.length?`已选择 ${items.length} 张图片`:'尚未选择图片';}
drop.onclick=e=>{if(e.target!==$('choose'))files.click()};$('choose').onclick=e=>{e.stopPropagation();files.click()};files.onchange=e=>addFiles(e.target.files);['dragenter','dragover'].forEach(x=>drop.addEventListener(x,e=>{e.preventDefault();drop.classList.add('over')}));['dragleave','drop'].forEach(x=>drop.addEventListener(x,e=>{e.preventDefault();drop.classList.remove('over')}));drop.addEventListener('drop',e=>addFiles(e.dataTransfer.files));preview.onclick=e=>{if(e.target.dataset.i){const i=+e.target.dataset.i;URL.revokeObjectURL(items[i].url);items.splice(i,1);render();showCrop()}};$('cropx').oninput=e=>{if(items[0]){items[0].crop=+e.target.value;showCrop()}};
function settings(){const fmt=document.querySelector('input[name=format]:checked').value;return {w:+$('w').value,h:+$('h').value,fmt,quality:fmt==='jpeg'?+$('jq').value/100:fmt==='webp'?+$('wq').value/100:+$('preset').value,noResize:$('noResize').checked,renameEnabled:$('renameEnabled').checked,prefix:$('prefix').value,start:+$('start').value}}
function process(it,s){return new Promise(res=>{const img=new Image();img.onload=()=>{let tw=s.noResize?img.width:s.w,th=s.noResize?img.height:s.h;let sx=0,sy=0,sw=img.width,sh=img.height;if(!s.noResize){const target=tw/th,cur=img.width/img.height;if(cur>target){sw=img.height*target;sx=(img.width-sw)*((it.crop??50)/100)}else{sh=img.width/target;sy=(img.height-sh)/2}}const c=document.createElement('canvas');c.width=tw;c.height=th;c.getContext('2d').drawImage(img,sx,sy,sw,sh,0,0,tw,th);let type=s.fmt==='webp'?'image/webp':s.fmt==='jpeg'?'image/jpeg':it.file.type||'image/png';c.toBlob(b=>res({blob:b,name:`${s.prefix}${String(s.start++).padStart(3,'0')}.${type.split('/')[1].replace('jpeg','jpg')}`}),type,s.quality)};img.src=it.url})}
async function output(zip){if(!items.length)return alert('请先选择图片');const s=settings();const out=[];for(const it of items)out.push(await process(it,s));if(zip){const z=new JSZip();out.forEach(x=>z.file(x.name,x.blob));download(await z.generateAsync({type:'blob'}),'裁切图片.zip')}else out.forEach(x=>download(x.blob,x.name))}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('save').onclick=()=>output(false);$('zip').onclick=()=>output(true);$('clear').onclick=()=>{items.forEach(x=>URL.revokeObjectURL(x.url));items=[];render()};$('preset').onchange=e=>{const v=e.target.value;$('jq').value=Math.round(v*100);$('wq').value=Math.round(v*100)};
// Thumbnail crop selection follows the target ratio and can be repositioned.
function ratioBox(){const ratio=+$('w').value/+$('h').value;document.querySelectorAll('.thumb .visual').forEach((v,i)=>{const r=v.querySelector('.selection');if(!r)return;const img=v.querySelector('img'),w=img.clientWidth,h=img.clientHeight;if(!w||!h)return;const it=items[i],pos=Math.max(0,Math.min(100,it.crop??50));if(w/h>ratio){const rw=h*ratio/w*100;r.style.width=rw+'%';r.style.height='100%';r.style.left=((100-rw)*pos/100)+'%';r.style.top='0'}else{const rh=w/ratio/h*100;r.style.width='100%';r.style.height=rh+'%';r.style.left='0';r.style.top=((100-rh)*pos/100)+'%'}})}
let dragging=null;const oldRender=render;render=function(){preview.innerHTML='';preview.style.display=items.length?'grid':'none';drop.style.display=items.length?'none':'flex';items.forEach((it,i)=>{const d=document.createElement('div');d.className='thumb';d.innerHTML=`<button data-i="${i}">×</button><div class="visual"><img draggable="false" src="${it.url}"><div class="selection"></div></div><span>${it.file.name}</span>`;preview.appendChild(d);const v=d.querySelector('.visual');v.addEventListener('mousedown',e=>{if(e.target.closest('button'))return;e.preventDefault();dragging={it,v,start:e.clientX,crop:it.crop||50};v.classList.add('dragging')});v.addEventListener('touchstart',e=>{const t=e.touches[0];dragging={it,v,start:t.clientX,crop:it.crop||50};v.classList.add('dragging')},{passive:false})});$('status').textContent=items.length?`已选择 ${items.length} 张图片`:'尚未选择图片';setTimeout(ratioBox,0)};
document.addEventListener('mousemove',e=>{if(!dragging)return;e.preventDefault();const img=dragging.v.querySelector('img'),ratio=+$('w').value/+$('h').value,vertical=img.clientWidth/img.clientHeight<=ratio,delta=((vertical?e.clientY:e.clientX)-dragging.start)/(vertical?img.clientHeight:img.clientWidth)*100;dragging.it.crop=Math.max(0,Math.min(100,dragging.crop+delta));ratioBox()});document.addEventListener('mouseup',()=>{if(dragging){dragging.v.classList.remove('dragging');dragging=null}});document.addEventListener('touchmove',e=>{if(!dragging)return;const t=e.touches[0],img=dragging.v.querySelector('img'),ratio=+$('w').value/+$('h').value,vertical=img.clientWidth/img.clientHeight<=ratio,delta=((vertical?t.clientY:t.clientX)-dragging.start)/(vertical?img.clientHeight:img.clientWidth)*100;dragging.it.crop=Math.max(0,Math.min(100,dragging.crop+delta));ratioBox()},{passive:false});document.addEventListener('touchend',()=>{if(dragging){dragging.v.classList.remove('dragging');dragging=null}});
['w','h','rw','rh'].forEach(id=>$(id).addEventListener('input',()=>{ratioBox();showCrop()}));
// Shared source geometry keeps the displayed selection and exported pixels identical.
const preferenceIds=['w','h','rw','rh','autoW','autoH','noResize','focus','preset','jq','wq','renameEnabled','prefix','start'];
const defaults=Object.fromEntries(preferenceIds.map(id=>[id,$(id).type==='checkbox'?$(id).checked:$(id).value]));
const preferenceKey='image-crop-settings-v2';let busy=false;
function dimensions(it){const s=settings(),iw=it.width,ih=it.height;let w=s.w,h=s.h;if(s.noResize)return {w:iw,h:ih};if($('autoW').checked)w=Math.max(1,Math.round(h*iw/ih));if($('autoH').checked)h=Math.max(1,Math.round(w*ih/iw));return {w,h};}
function geometry(it){const {w,h}=dimensions(it);let sw=it.width,sh=it.height;if(sw/sh>w/h)sw=sh*w/h;else sh=sw*h/w;return {w,h,sw,sh,x:(it.width-sw)*(it.crop??50)/100,y:(it.height-sh)*(it.crop??50)/100};}
function validSettings(){const s=settings();if(!Number.isInteger(s.w)||s.w<1||s.w>16384||!Number.isInteger(s.h)||s.h<1||s.h>16384)throw Error('宽高须为 1–16384 的整数');if(!Number.isInteger(s.start)||s.start<0)throw Error('起始编号须为非负整数');if(!Number.isFinite(s.quality)||s.quality<=0||s.quality>1)throw Error('质量须为 1–100%');return s;}
function outputName(it,i,s){let type=s.fmt==='same'?it.file.type:'image/'+s.fmt;if(!['image/png','image/jpeg','image/webp'].includes(type))type='image/png';const ext=type==='image/jpeg'?'jpg':type.split('/')[1];let base;if(s.renameEnabled)base=(s.prefix||'图片_')+String(s.start+i).padStart(3,'0');else base=it.file.name.replace(/\.[^.]+$/,'');return {type,name:base.replace(/[\\/:*?"<>|]/g,'_')+'.'+ext};}
const more=document.createElement('button');more.className='upload';more.textContent='添加更多图片';more.onclick=()=>files.click();preview.after(more);
const naming=document.createElement('p');naming.className='status';$('status').before(naming);
const reset=document.createElement('button');reset.className='upload';reset.textContent='恢复默认设置';$('clear').after(reset);$('clear').textContent='移除全部';
$('focus').parentElement.lastChild.textContent='自动选择图像焦点（视觉显著性）';
function remember(){try{localStorage.setItem(preferenceKey,JSON.stringify({...Object.fromEntries(preferenceIds.map(id=>[id,$(id).type==='checkbox'?$(id).checked:$(id).value])),format:document.querySelector('[name=format]:checked').value}));}catch{}}
function controls(){if($('autoW').checked&&$('autoH').checked)$('autoH').checked=false;$('w').disabled=$('autoW').checked||$('noResize').checked;$('h').disabled=$('autoH').checked||$('noResize').checked;ratioBox();if(items.length){try{const s=validSettings();naming.textContent='导出文件名：'+outputName(items[0],0,s).name+' … '+outputName(items.at(-1),items.length-1,s).name;}catch(e){naming.textContent=e.message;}}else naming.textContent='';remember();}
ratioBox=function(){document.querySelectorAll('.thumb .visual').forEach((v,i)=>{const it=items[i];if(!it?.width)return;const g=geometry(it),r=v.querySelector('.selection');Object.assign(r.style,{left:g.x/it.width*100+'%',top:g.y/it.height*100+'%',width:g.sw/it.width*100+'%',height:g.sh/it.height*100+'%'});});};
render=function(){preview.replaceChildren();drop.style.display=items.length?'none':'flex';more.hidden=!items.length;items.forEach((it,i)=>{const d=document.createElement('div');d.className='thumb';const v=document.createElement('div');v.className='visual';const img=document.createElement('img');img.src=it.url;img.draggable=false;const r=document.createElement('div');r.className='selection';v.append(img,r);const label=document.createElement('span');label.textContent=it.file.name;label.title=it.file.name;const remove=document.createElement('button');remove.textContent='×';remove.onclick=e=>{e.stopPropagation();if(busy)return;URL.revokeObjectURL(it.url);items.splice(i,1);render();};d.append(v,label,remove);preview.append(d);let drag=null;v.onpointerdown=e=>{if(busy||!it.width)return;e.preventDefault();v.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,crop:it.crop??50};};v.onpointermove=e=>{if(!drag)return;const g=geometry(it),horizontal=it.width-g.sw>0.01;const travel=horizontal?v.clientWidth*(1-g.sw/it.width):v.clientHeight*(1-g.sh/it.height);if(travel<.1)return;it.crop=Math.max(0,Math.min(100,drag.crop+100*((horizontal?e.clientX-drag.x:e.clientY-drag.y)/travel)));it.manual=true;ratioBox();};v.onpointerup=v.onpointercancel=v.onlostpointercapture=()=>{drag=null;};img.onload=ratioBox;});$('status').textContent=items.length?'已选择 '+items.length+' 张图片':'尚未选择图片';controls();};
// Remove the legacy mouse handlers; all dragging uses pointer events above.
dragging=null;
async function autoLocate(it){if(it.manual||!$('focus').checked||typeof smartcrop==='undefined')return;const d=dimensions(it);try{const result=await smartcrop.crop(it.image,{width:d.w,height:d.h});if(it.manual)return;const c=result.topCrop;const horizontal=it.width/it.height>d.w/d.h;const travel=horizontal?it.width-c.width:it.height-c.height;it.crop=travel>0?Math.max(0,Math.min(100,(horizontal?c.x:c.y)/travel*100)):50;}catch{}ratioBox();}
addFiles=async function(list){if(busy)return;let failures=0;for(const file of list){if(!['image/png','image/jpeg','image/webp'].includes(file.type)){failures++;continue;}const url=URL.createObjectURL(file);try{const img=new Image();img.src=url;await img.decode();const it={file,url,image:img,width:img.naturalWidth,height:img.naturalHeight,crop:50,manual:false};items.push(it);await autoLocate(it);}catch{URL.revokeObjectURL(url);failures++;}}files.value='';render();if(failures)$('status').textContent+='；跳过 '+failures+' 个不支持或损坏文件';};
showCrop=function(){};preview.onclick=null;
process=async function(it,s){const g=geometry(it);if(g.w*g.h>40000000)throw Error('输出图片过大，请降低尺寸');const c=document.createElement('canvas');c.width=g.w;c.height=g.h;const {type,name}=outputName(it,s.index,s);const ctx=c.getContext('2d');if(type==='image/jpeg'){ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);}ctx.drawImage(it.image,g.x,g.y,g.sw,g.sh,0,0,g.w,g.h);const blob=await new Promise(resolve=>c.toBlob(resolve,type,s.quality));c.width=c.height=1;if(!blob)throw Error('图片编码失败');return {blob,name};};
output=async function(zip){if(busy)return;if(!items.length)return alert('请先选择图片');try{const s=validSettings();const batch=zip||items.length>1;if(batch&&typeof JSZip==='undefined')throw Error('ZIP 组件未加载，请联网刷新');busy=true;$('zip').disabled=$('save').disabled=true;const z=batch?new JSZip():null;const names=new Set();for(let i=0;i<items.length;i++){$('status').textContent='正在处理 '+(i+1)+' / '+items.length;await new Promise(resolve=>requestAnimationFrame(resolve));const out=await process(items[i],{...s,index:i});if(names.has(out.name))out.name=out.name.replace(/(\.[^.]+)$/,'_'+(i+1)+'$1');names.add(out.name);if(batch)z.file(out.name,out.blob);else download(out.blob,out.name);}if(batch){$('status').textContent='正在打包 '+items.length+' 张图片…';download(await z.generateAsync({type:'blob'}),'裁切图片.zip');}$('status').textContent=items.length+' 张图片已全部保存'+(batch?'到 ZIP 压缩包':'');}catch(e){$('status').textContent='导出失败：'+e.message;}finally{busy=false;$('zip').disabled=$('save').disabled=false;}};
reset.onclick=()=>{if(busy)return;for(const [id,value]of Object.entries(defaults)){if($(id).type==='checkbox')$(id).checked=value;else $(id).value=value;}document.querySelector('[name=format][value=same]').checked=true;controls();};
$('clear').onclick=()=>{if(busy)return;items.forEach(it=>URL.revokeObjectURL(it.url));items=[];files.value='';render();};
for(const id of preferenceIds)$(id).onchange=()=>{if(id==='autoH'&&$('autoH').checked)$('autoW').checked=false;if(id==='rw'||id==='rh'){if(+$('rw').value>0&&+$('rh').value>0)$('h').value=Math.max(1,Math.round(+$('w').value*+$('rh').value/+$('rw').value));}else if(id==='w'||id==='h'){let a=+$('w').value,b=+$('h').value;const gcd=(a,b)=>b?gcd(b,a%b):a;if(Number.isInteger(a)&&Number.isInteger(b)&&a>0&&b>0){const g=gcd(a,b);$('rw').value=a/g;$('rh').value=b/g;}}if(id==='preset')$('jq').value=$('wq').value=Math.round(+$('preset').value*100);if(id==='focus')items.forEach(it=>{if(!it.manual){it.crop=50;autoLocate(it);}});controls();};
document.querySelectorAll('[name=format]').forEach(r=>r.onchange=controls);
try{const saved=JSON.parse(localStorage.getItem(preferenceKey)||'null');if(saved){for(const id of preferenceIds)if(id in saved){if($(id).type==='checkbox')$(id).checked=!!saved[id];else $(id).value=saved[id];}const radio=document.querySelector('[name=format][value="'+saved.format+'"]');if(radio)radio.checked=true;}}catch{}
window.addEventListener('resize',ratioBox);
render();
